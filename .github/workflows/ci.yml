name: CI

# Roda a cada push (qualquer branch) e a cada Pull Request
on:
  push:
  pull_request:

# Cancela execuções antigas da mesma branch quando chega um commit novo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Linter, testes e build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Instalar o Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Linter (ESLint)
        run: npm run lint

      - name: Testes (Vitest)
        run: npm test

      - name: Build de produção
        run: npm run build

  banco:
    name: Backend · lint, testes e build
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: j360_ci
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: j360_build_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pj360_ci"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: backend
    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_NAME: j360_build_ci
      DB_PASSWORD: j360_ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run migrate:dist
      - name: Verificar a API gerada
        run: |
          node dist/servidor.mjs &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused \
            http://127.0.0.1:3001/api/sessao | grep -x null
